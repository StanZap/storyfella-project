<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Storyfella — Canvas prototype</title>
<style>
  :root {
    --bg:#0b0b0e; --panel:#101014; --panel-2:#141419;
    --line:rgba(255,255,255,.06); --line-2:rgba(255,255,255,.09);
    --text:#e4e4e7; --dim:#a1a1aa; --dimmer:#71717a; --faint:#52525b;
    --violet:#a78bfa; --violet-bg:rgba(139,92,246,.18);
    --amber:#fbbf24; --amber-bg:rgba(251,191,36,.14);
    --teal:#5eead4; --green:#86efac;
    --mono: ui-monospace,"SF Mono","JetBrains Mono",Menlo,Consolas,monospace;
    --sans: ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; }
  body { background:var(--bg); color:var(--text); font-family:var(--sans);
         font-size:13px; -webkit-font-smoothing:antialiased;
         display:flex; flex-direction:column; overflow:hidden; }

  .topbar { display:flex; align-items:center; gap:14px; height:44px; padding:0 14px;
            background:var(--panel); border-bottom:1px solid var(--line); flex:none; }
  .brand { font-size:11px; font-weight:600; letter-spacing:.04em;
           text-transform:uppercase; color:var(--faint); }
  .crumbs { font-size:12px; color:var(--dim); font-family:var(--mono); }
  .crumbs b { color:var(--text); font-weight:600; }
  .crumbs .sep { color:#3f3f46; margin:0 6px; }
  .tabs { display:flex; gap:2px; margin-left:auto; }
  .tab { font:inherit; font-size:11px; font-weight:500; padding:5px 11px; border-radius:7px;
         background:none; border:0; color:var(--dimmer); cursor:pointer;
         display:flex; align-items:center; gap:6px; }
  .tab.on { background:var(--violet-bg); color:var(--violet); }
  kbd { font-family:var(--mono); font-size:10px; padding:1px 4px; border-radius:4px;
        background:rgba(255,255,255,.05); border:1px solid var(--line-2); color:var(--dim); }
  .tab kbd { font-size:9px; opacity:.55; }

  .main { flex:1; min-height:0; display:flex; }
  .pane-head { display:flex; align-items:center; gap:9px; padding:9px 14px;
               border-bottom:1px solid var(--line); flex:none; }
  .pane-title { font-size:10px; font-weight:600; letter-spacing:.07em;
                text-transform:uppercase; color:var(--faint); }
  .spacer { margin-left:auto; }
  .hintline { font-size:10.5px; color:var(--faint); }

  /* ================================================================== HOME */

  .home { flex:1; display:flex; flex-direction:column; min-height:0; }
  .home-scroll { flex:1; overflow-y:auto; padding:16px 18px 40px; }

  .group-label { display:flex; align-items:center; gap:8px; font-size:10px; font-weight:600;
                 letter-spacing:.07em; text-transform:uppercase; color:var(--faint);
                 margin:22px 0 10px; }
  .group-label:first-child { margin-top:0; }
  .group-label .count { font-weight:500; letter-spacing:0; color:#3f3f46; text-transform:none; }
  .group-label .rule { flex:1; height:1px; background:var(--line); }

  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(148px,1fr)); gap:14px; }

  .tile { cursor:pointer; }
  .tile-art { position:relative; aspect-ratio:2/3; margin-bottom:8px; }
  .tile-img { position:absolute; inset:0; border-radius:10px; overflow:hidden;
              border:1px solid rgba(255,255,255,.11);
              display:flex; align-items:center; justify-content:center;
              font-size:30px; font-weight:700; color:rgba(255,255,255,.55); }
  .st1,.st2 { position:absolute; inset:0; border-radius:10px; background:#1c1c23;
              border:1px solid rgba(255,255,255,.08); }
  .st1 { transform:translate(5px,-4px) rotate(2.5deg); }
  .st2 { transform:translate(10px,-8px) rotate(5deg); opacity:.5; }
  .tile-img.empty { background:repeating-linear-gradient(45deg,
                      rgba(251,191,36,.05) 0 7px, transparent 7px 14px);
                    border:1px dashed rgba(251,191,36,.32);
                    color:rgba(251,191,36,.6); font-size:26px; font-weight:300; }
  .tile.cur .tile-img { outline:2px solid var(--violet); outline-offset:2px; }
  .tile.cur .tile-name { color:var(--violet); }

  .badge { position:absolute; top:6px; right:6px; z-index:3;
           font-size:9px; font-weight:700; letter-spacing:.04em;
           padding:2px 6px; border-radius:5px;
           background:rgba(0,0,0,.6); color:var(--dim);
           backdrop-filter:blur(4px); border:1px solid rgba(255,255,255,.1); }
  .badge.working { background:rgba(139,92,246,.3); color:#ddd6fe;
                   border-color:rgba(167,139,250,.4); }

  .tile-name { font-family:var(--mono); font-size:12px; font-weight:600;
               white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .tile.pending .tile-name { color:var(--amber); }
  .tile-meta { font-size:10px; color:var(--dimmer); margin-top:2px; }
  .tile-meta .from { color:var(--faint); font-family:var(--mono); }

  /* ================================================================ DETAIL */

  .detail { flex:1; display:flex; min-height:0; }

  /* --- centre column: the picture and its history --- */
  .render-pane { flex:1; display:flex; flex-direction:column; min-width:0;
                 background:var(--bg); }
  .stage { flex:1; display:flex; align-items:center; justify-content:center;
           padding:20px; min-height:0; }
  .stage-img { height:100%; aspect-ratio:2/3; border-radius:12px;
               border:1px solid rgba(255,255,255,.12);
               display:flex; align-items:center; justify-content:center;
               font-size:56px; font-weight:700; color:rgba(255,255,255,.5);
               box-shadow:0 24px 70px rgba(0,0,0,.5); }

  .strip { flex:none; display:flex; gap:8px; padding:10px 14px; overflow-x:auto;
           justify-content:center; border-top:1px solid var(--line); }
  .chip-v { flex:none; width:44px; height:60px; border-radius:7px; cursor:pointer;
            border:1px solid rgba(255,255,255,.11); position:relative;
            display:flex; align-items:flex-end; justify-content:center;
            font-size:9px; font-weight:700; color:rgba(255,255,255,.75);
            padding-bottom:3px; font-family:var(--mono); }
  .chip-v.on { outline:2px solid var(--violet); outline-offset:2px; }
  .chip-v.add { border:1px dashed var(--line-2); background:none; color:var(--faint);
                align-items:center; font-size:17px; font-weight:300; padding:0; }

  .revs { flex:none; max-height:190px; overflow-y:auto; border-top:1px solid var(--line);
          padding:8px 0; }
  .rev { display:flex; align-items:center; gap:10px; padding:6px 14px; cursor:pointer;
         font-size:11px; }
  .rev:hover { background:rgba(255,255,255,.025); }
  .rev.on { background:rgba(139,92,246,.09); }
  .rev-dot { width:6px; height:6px; border-radius:50%; flex:none; }
  .rev-dot.canon { background:var(--violet); }
  .rev-dot.exp { background:var(--amber); }
  .rev-txt { min-width:0; flex:1; }
  .rev-title { color:var(--text); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .rev-sub { color:var(--faint); font-size:10px; font-family:var(--mono); margin-top:1px; }
  .rev-tag { flex:none; font-size:9px; font-weight:700; letter-spacing:.05em;
             padding:2px 6px; border-radius:5px; text-transform:uppercase; }
  .rev-tag.canon { background:var(--violet-bg); color:var(--violet); }
  .rev-tag.exp { background:var(--amber-bg); color:var(--amber); }
  .promote { flex:none; font-size:10px; font-weight:600; font-family:var(--sans);
             padding:3px 8px; border-radius:6px; border:0; cursor:pointer;
             background:var(--amber-bg); color:var(--amber); opacity:0; }
  .rev:hover .promote, .rev.on .promote { opacity:1; }

  /* composer — the tokenized command bar */
  .composer { flex:none; border-top:1px solid var(--line);
              background:var(--panel-2); position:relative; }

  /* signature help: the grammar of the op being typed */
  .sig { display:flex; align-items:center; gap:9px; padding:6px 14px 0;
         font-family:var(--mono); font-size:10.5px; color:var(--faint); min-height:22px; }
  .sig .sig-op { color:var(--violet); font-weight:600; }
  .sig .p { color:#3f3f46; }
  .sig .p.on { color:var(--teal); font-weight:600; }
  .sig .sig-desc { margin-left:auto; font-family:var(--sans); font-size:10px; color:#3f3f46; }

  .cmdbar { display:flex; align-items:center; gap:8px; padding:7px 14px 9px; }
  .cmdbar .lead { color:var(--violet); font-family:var(--mono); font-size:13px; flex:none; }
  .cmdwrap { position:relative; flex:1; height:20px; overflow:hidden; }

  /* the highlight layer and the real input share exact metrics; chips get
     their padding from box-shadow so they never shift the text */
  .cmdhl, #cmd {
    position:absolute; inset:0; width:100%; height:20px; margin:0; border:0;
    font-family:var(--mono); font-size:12.5px; line-height:20px;
    white-space:pre; overflow:hidden; letter-spacing:0;
  }
  .cmdhl { pointer-events:none; z-index:1; }
  #cmd { background:none; outline:none; z-index:2;
         color:transparent; caret-color:var(--violet); }
  #cmd::placeholder { color:#3f3f46; }

  .t-op    { color:var(--violet); font-weight:600; }
  .t-op.bad{ color:var(--rose); text-decoration:underline wavy rgba(251,113,133,.5); }
  .t-ref   { color:#c4b5fd; background:rgba(139,92,246,.16); border-radius:3px;
             box-shadow:0 0 0 2px rgba(139,92,246,.16); }
  .t-ref.pending { color:var(--amber); background:var(--amber-bg);
                   box-shadow:0 0 0 2px var(--amber-bg); }
  .t-ref.unknown { color:var(--rose); background:rgba(251,113,133,.13);
                   box-shadow:0 0 0 2px rgba(251,113,133,.13); }
  .t-flag  { color:#7dd3fc; }
  .t-num   { color:var(--green); }
  .t-size  { color:var(--green); }
  .t-txt   { color:var(--dim); }

  .runhint { flex:none; font-size:10px; color:#3f3f46; font-family:var(--sans); }

  /* completion popup — opens upward, it lives at the bottom of the screen */
  .cmdac { position:absolute; bottom:100%; margin-bottom:6px; z-index:40;
           width:330px; border-radius:10px; overflow:hidden; background:#17171d;
           border:1px solid var(--line-2); box-shadow:0 -18px 50px rgba(0,0,0,.6); }
  .cmdac-head { font-size:9.5px; letter-spacing:.07em; text-transform:uppercase;
                color:var(--faint); padding:7px 11px 5px; }
  .ac-row { display:flex; align-items:center; gap:9px; padding:6px 11px; cursor:pointer; }
  .ac-row.on { background:var(--violet-bg); }
  .ac-sw { flex:none; width:18px; height:18px; border-radius:5px;
           display:flex; align-items:center; justify-content:center;
           font-size:9px; font-weight:700; color:rgba(255,255,255,.8); }
  .ac-lbl { font-family:var(--mono); font-size:12px; color:var(--text); }
  .ac-lbl.pending { color:var(--amber); }
  .ac-hint { margin-left:auto; font-size:10.5px; color:var(--dimmer); }

  /* --- right: the inspector --- */
  .inspector { flex:0 0 296px; display:flex; flex-direction:column; min-height:0;
               background:var(--panel); border-left:1px solid var(--line); }
  .insp-scroll { flex:1; overflow-y:auto; padding:14px; }

  .sect { margin-bottom:20px; }
  .sect:last-child { margin-bottom:0; }
  .sect-label { font-size:10px; font-weight:600; letter-spacing:.07em;
                text-transform:uppercase; color:var(--faint); margin-bottom:9px;
                display:flex; align-items:center; gap:7px; }
  .sect-label .tag { font-size:9px; letter-spacing:0; text-transform:none;
                     padding:1px 6px; border-radius:5px;
                     background:var(--violet-bg); color:var(--violet); font-weight:700; }

  .desc { width:100%; min-height:104px; resize:vertical;
          background:var(--panel-2); border:1px solid var(--line);
          border-radius:9px; padding:9px 10px;
          color:var(--text); font-family:var(--sans); font-size:12px; line-height:1.6; }
  .desc:focus { outline:none; border-color:rgba(167,139,250,.45);
                background:#17171d; }
  .desc-foot { display:flex; align-items:center; gap:8px; margin-top:7px; }
  .desc-note { font-size:10px; color:var(--faint); flex:1; line-height:1.4; }
  .btn { font:inherit; font-family:var(--sans); font-size:11px; font-weight:600;
         padding:5px 11px; border-radius:7px; border:0; cursor:pointer;
         background:var(--violet-bg); color:var(--violet); white-space:nowrap; }
  .btn:hover { filter:brightness(1.25); }
  .btn.quiet { background:rgba(255,255,255,.05); color:var(--dim); }

  .field { margin-bottom:13px; }
  .field:last-child { margin-bottom:0; }
  .field-head { display:flex; align-items:baseline; gap:8px; margin-bottom:6px; }
  .field-name { font-size:11px; color:var(--dim); }
  .field-val { margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--text); }
  .field-val .unit { color:var(--faint); }

  .seg { display:flex; gap:3px; background:rgba(255,255,255,.035);
         padding:3px; border-radius:8px; }
  .seg button { flex:1; font:inherit; font-size:10.5px; font-family:var(--mono);
                padding:5px 0; border:0; border-radius:6px; cursor:pointer;
                background:none; color:var(--dimmer); }
  .seg button.on { background:var(--violet-bg); color:var(--violet); font-weight:600; }
  .seg button:hover:not(.on) { color:var(--dim); }

  input[type=range] { -webkit-appearance:none; appearance:none; width:100%;
                      height:3px; border-radius:2px; background:rgba(255,255,255,.1); }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance:none; appearance:none;
    width:13px; height:13px; border-radius:50%; background:var(--violet); cursor:pointer;
    box-shadow:0 0 0 3px rgba(139,92,246,.18); }
  input[type=range]::-moz-range-thumb { width:13px; height:13px; border:0;
    border-radius:50%; background:var(--violet); cursor:pointer; }

  .seed-row { display:flex; align-items:center; gap:7px; }
  .seed-val { flex:1; font-family:var(--mono); font-size:12px;
              background:var(--panel-2); border:1px solid var(--line);
              border-radius:7px; padding:6px 9px; color:var(--text); }
  .lock { flex:none; font-size:11px; padding:6px 9px; border-radius:7px;
          border:0; cursor:pointer; font-family:var(--sans); font-weight:600;
          background:rgba(255,255,255,.05); color:var(--dimmer); }
  .lock.on { background:var(--amber-bg); color:var(--amber); }

  .chiprow { display:flex; flex-wrap:wrap; gap:6px; }
  .ref { font-family:var(--mono); font-size:11px; border-radius:6px;
         padding:3px 7px; cursor:pointer;
         background:rgba(139,92,246,.13); color:#c4b5fd; }
  .ref.pending { background:var(--amber-bg); color:var(--amber);
                 border:1px dashed rgba(251,191,36,.45); }
  .ref:hover { filter:brightness(1.25); }
  .backref { font-family:var(--mono); font-size:11px; border-radius:6px;
             padding:3px 7px; cursor:pointer;
             background:rgba(94,234,212,.1); color:var(--teal); }
  .backref:hover { filter:brightness(1.2); }

  /* ================================================================ palette */
  .veil { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.55);
          display:flex; align-items:flex-start; justify-content:center; padding-top:13vh; }
  .veil[hidden] { display:none; }
  .palette { width:min(560px,90vw); background:#17171d; border:1px solid var(--line-2);
             border-radius:14px; overflow:hidden; box-shadow:0 40px 100px rgba(0,0,0,.7); }
  .pal-input { display:flex; align-items:center; gap:9px; padding:13px 16px;
               border-bottom:1px solid var(--line); }
  .pal-input .lead { color:var(--violet); font-family:var(--mono); font-size:13px; }
  .pal-input input { flex:1; background:none; border:0; outline:none;
                     color:var(--text); font-family:var(--mono); font-size:13px; }
  .pal-input input::placeholder { color:#3f3f46; }
  .pal-scope { font-size:10px; padding:2px 7px; border-radius:5px;
               background:var(--violet-bg); color:var(--violet); font-weight:600;
               font-family:var(--mono); }
  .pal-list { max-height:330px; overflow-y:auto; padding:5px; }
  .pal-item { display:flex; align-items:center; gap:10px; padding:8px 11px;
              border-radius:8px; cursor:pointer; }
  .pal-item.on { background:var(--violet-bg); }
  .pal-cmd { font-family:var(--mono); font-size:12px; color:var(--text); }
  .pal-desc { font-size:11px; color:var(--dimmer); margin-left:auto; }
  .pal-empty { padding:16px; font-size:11px; color:var(--faint); text-align:center; }
  .pal-note { padding:9px 16px; font-size:10.5px; color:var(--faint);
              border-top:1px solid var(--line); background:rgba(255,255,255,.015); }

  /* ============================================================== statusbar */
  .status { display:flex; align-items:center; gap:12px; height:26px; padding:0 12px;
            flex:none; background:var(--panel); border-top:1px solid var(--line);
            font-size:10.5px; color:var(--dimmer); font-family:var(--mono); }
  .mode { font-weight:700; letter-spacing:.08em; font-size:10px;
          padding:2px 8px; border-radius:4px; }
  .mode.normal { background:var(--violet-bg); color:var(--violet); }
  .mode.insert { background:rgba(94,234,212,.16); color:var(--teal); }
  .status .right { margin-left:auto; display:flex; gap:12px; align-items:center; }
  .status .hint { color:#3f3f46; font-family:var(--sans); }
  .status .warncount { color:var(--amber); }

  ::-webkit-scrollbar { width:9px; height:9px; }
  ::-webkit-scrollbar-thumb { background:#26262e; border-radius:5px; }
  ::-webkit-scrollbar-track { background:transparent; }
</style>
</head>
<body>

<div class="topbar">
  <span class="brand">Storyfella</span>
  <span class="crumbs" id="crumbs"></span>
  <div class="tabs">
    <button class="tab">Story <kbd>g s</kbd></button>
    <button class="tab on">Canvas <kbd>g c</kbd></button>
    <button class="tab">Run <kbd>g r</kbd></button>
  </div>
</div>

<div class="main" id="main"></div>

<div class="veil" id="veil" hidden>
  <div class="palette">
    <div class="pal-input">
      <span class="lead">&gt;</span>
      <input id="palQ" placeholder="Search commands and artifacts…" autocomplete="off">
      <span class="pal-scope" id="palScope"></span>
    </div>
    <div class="pal-list" id="palList"></div>
    <div class="pal-note">The same closed vocabulary as the composer and the <code>svs</code> CLI.</div>
  </div>
</div>

<div class="status">
  <span class="mode normal" id="mode">NORMAL</span>
  <span id="pos"></span>
  <div class="right">
    <span class="warncount" id="warns"></span>
    <span class="hint" id="keyhint"></span>
  </div>
</div>

<script>
"use strict";

/* --------------------------------------------------------------- registry */

const A = {
  mara:             { kind:"character",   status:"ok",      variants:3, hue:268,
                      note:"harbourmaster", from:"harbor.arrival" },
  tam:              { kind:"character",   status:"ok",      variants:1, hue:22,
                      note:"courier", from:"harbor.arrival" },
  keeper_elias:     { kind:"character",   status:"pending", variants:0, hue:0,
                      note:"", from:"lighthouse.climb" },
  harbor_dock:      { kind:"environment", status:"ok",      variants:2, hue:196,
                      note:"dawn, low tide", from:"harbor" },
  lighthouse_tower: { kind:"environment", status:"pending", variants:0, hue:0,
                      note:"", from:"lighthouse" },
  ellery_road:      { kind:"environment", status:"ok",      variants:1, hue:150,
                      note:"washed out", from:"harbor.arrival" },
  brass_lantern:    { kind:"object",      status:"working", variants:0, hue:44,
                      note:"generating", from:"harbor.handoff" },
  wreck_hull:       { kind:"object",      status:"pending", variants:0, hue:0,
                      note:"", from:"harbor.wreck" },
  rope_coil:        { kind:"object",      status:"ok",      variants:1, hue:32,
                      note:"", from:"harbor.handoff" },
};

const ORDER = ["character", "environment", "object"];
const NAMES = Object.keys(A);

/* Per-artifact generation parameters. Plain data behind plain controls —
   no grammar, no parsing. */
const P = {
  mara: {
    desc: "A harbourmaster in her forties, weathered face, close-cropped grey " +
          "hair, heavy navy oilskin coat, standing square against the wind.",
    size: "1024x1536", steps: 8, seed: 4471, seedLocked: true,
    lora: "coastal_grit", loraWeight: 0.7,
    appearsIn: ["harbor.arrival", "harbor.handoff"],
  },
};

const SIZES = ["512x768", "768x1152", "1024x1536"];

function params(name) {
  if (!P[name]) {
    P[name] = { desc:"", size:"768x1152", steps:6, seed:1000 + Math.floor(Math.random()*9000),
                seedLocked:false, lora:null, loraWeight:.6, appearsIn:[A[name].from] };
  }
  return P[name];
}

const REVS = {
  mara: [
    { t:"A harbourmaster in her forties, weathered face…", sub:"rev 4 · krea-2-turbo-q4 · seed 4471",
      tag:"canon", v:1 },
    { t:"dye her hair auburn",           sub:"rev 3 · modify · seed 9120", tag:"exp", v:3 },
    { t:"in heavy yellow oilskins",      sub:"rev 2 · variant · seed 7734", tag:"exp", v:2 },
    { t:"A harbourmaster in her forties…", sub:"rev 1 · create · seed 4471", tag:"canon", v:1 },
  ],
};

/* ------------------------------------------------------------------ state */

let view   = "home";     // home | detail
let sel    = 0;          // index into NAMES (home cursor)
let open   = null;       // artifact name (detail)
let mode   = "normal";
let variant = 1;
let rev     = 0;
let cols    = 4;

const el = (id) => document.getElementById(id);
const grad = (h) => `linear-gradient(150deg, hsl(${h} 42% 38%), hsl(${h+26} 34% 17%))`;

/* ------------------------------------------------------------------- home */

function tile(name, i) {
  const a = A[name];
  const cur = i === sel ? " cur" : "";
  const stack = a.variants > 2 ? `<div class="st2"></div><div class="st1"></div>`
              : a.variants > 1 ? `<div class="st1"></div>` : "";

  let art;
  if (a.status === "ok") {
    art = `${stack}<div class="tile-img" style="background:${grad(a.hue)}">${name[0].toUpperCase()}</div>`;
  } else if (a.status === "working") {
    art = `<div class="badge working">rendering</div>` +
          `<div class="tile-img" style="background:${grad(a.hue)};opacity:.4">${name[0].toUpperCase()}</div>`;
  } else {
    art = `<div class="tile-img empty">+</div>`;
  }
  const badge = a.variants > 1 ? `<div class="badge">${a.variants}</div>` : "";

  const meta = a.status === "pending"
    ? `<span style="color:var(--amber)">not created</span> · <span class="from">${a.from}</span>`
    : a.status === "working"
      ? `<span style="color:var(--violet)">generating…</span>`
      : `${a.note || a.kind} · <span class="from">${a.from}</span>`;

  return `<div class="tile ${a.status}${cur}" data-i="${i}">` +
           `<div class="tile-art">${badge}${art}</div>` +
           `<div class="tile-name">${name}</div>` +
           `<div class="tile-meta">${meta}</div></div>`;
}

function renderHome() {
  const pending = NAMES.filter(n => A[n].status === "pending").length;
  el("crumbs").innerHTML = `<b>Canvas</b>`;
  el("warns").textContent = `${pending} pending`;
  el("pos").textContent = `${sel + 1}/${NAMES.length}`;
  el("keyhint").textContent = "hjkl move · ⏎ open · n new · ⌃K palette";

  let html = `<div class="home"><div class="home-scroll">`;

  for (const kind of ORDER) {
    const group = NAMES.map((n, i) => [n, i]).filter(([n]) => A[n].kind === kind);
    const npend = group.filter(([n]) => A[n].status === "pending").length;
    html += `<div class="group-label">${kind}s ` +
            `<span class="count">${group.length}</span>` +
            (npend ? ` <span class="count" style="color:var(--amber)">· ${npend} pending</span>` : "") +
            `<span class="rule"></span></div>`;
    html += `<div class="grid">${group.map(([n, i]) => tile(n, i)).join("")}</div>`;
  }
  html += `</div></div>`;
  el("main").innerHTML = html;
  el("main").className = "main";
  document.querySelector(".tile.cur")?.scrollIntoView({ block:"nearest" });
}

/* ----------------------------------------------------------------- detail */

  el("main").innerHTML =
    `<div class="detail">

         <div class="revs">${revs}</div>
         <div class="composer">
           <div class="sig" id="sig"></div>
           <div class="cmdbar">
             <span class="lead">&gt;</span>
             <div class="cmdwrap">
               <div class="cmdhl" id="cmdhl"></div>
               <input id="cmd" autocomplete="off" spellcheck="false"
                      placeholder="/modify c:${open} …">
             </div>
             <span class="runhint">⏎ run · ⇥ complete</span>
           </div>
         </div>
       </div>

       <aside class="inspector">
         <div class="pane-head"><span class="pane-title">${a.kind}</span>
           <span class="spacer"></span>
           <span class="hintline" style="font-family:var(--mono)">${open}</span></div>
         <div class="insp-scroll">

           <div class="sect">
             <div class="sect-label">Description <span class="tag">canon</span></div>
             <textarea class="desc" id="descBox"
               placeholder="What this ${a.kind} is…">${p.desc}</textarea>
             <div class="desc-foot">
               <span class="desc-note">Every generation is grounded against this.</span>

           </div>

             <div class="sect-label">Generation</div>

             <div class="field">
               <div class="field-head"><span class="field-name">Canvas</span></div>
               <div class="seg" id="sizeSeg">${sizeSeg}</div>

             <div class="field">
               <div class="field-head"><span class="field-name">Steps</span>
                 <span class="field-val">${p.steps} <span class="unit">· ~${(p.steps * 1.4).toFixed(1)}s</span></span></div>
               <input type="range" id="stepsR" min="2" max="24" step="1" value="${p.steps}">

             <div class="field">

               <div class="seed-row">

  el("main").className = "main";

  const steps = document.getElementById("stepsR");
  if (steps) steps.addEventListener("input", (e) => { p.steps = +e.target.value; renderDetail(); });

  if (loraR) loraR.addEventListener("input", (e) => { p.loraWeight = +e.target.value; renderDetail(); });
  const box = document.getElementById("descBox");
  if (box) box.addEventListener("input", (e) => { p.desc = e.target.value; });

function render() { view === "home" ? renderHome() : renderDetail(); }

/* ------------------------------------------------------------------ input */

function setMode(m) {
  mode = m;
  const e = el("mode");
  e.textContent = m.toUpperCase();
  e.className = "mode " + m;
}

/* ========================================================== the command bar
   One closed vocabulary. Everything the inspector does is reachable here,
   and running a command moves the inspector — they are two views of the
   same state, not two features. */

const OPS = {
  "/modify":     { sig:["c:<artifact>", "<instruction>"], flags:["--steps","--seed"],
                   desc:"instruction edit — an experiment" },
  "/describe":   { sig:["c:<artifact>", "<description>"], flags:[],
                   desc:"replace the canonical description" },
  "/variant":    { sig:["c:<artifact>", "<description>"], flags:["--size","--steps"],
                   desc:"new look from a base" },
  "/regenerate": { sig:["c:<artifact>"], flags:["--steps","--seed"],
                   desc:"reroll from the description" },
  "/resize":     { sig:["c:<artifact>", "<WxH>"], flags:[],
                   desc:"set the artifact canvas" },
  "/lora":       { sig:["attach", "c:<artifact>", "<lora>"], flags:["--weight"],
                   desc:"bind a LoRA" },
  "/create":     { sig:["<kind>", "<name>", "<description>"], flags:["--size","--steps"],
                   desc:"new artifact" },
};

const FLAG_VALUES = {
  "--size":   SIZES,
  "--steps":  ["4","8","12","16","24"],
  "--seed":   ["locked", "random"],
  "--weight": ["0.4","0.6","0.8","1.0"],
};

let cmdText = "", cmdFocused = false, acSel = 0, acOpen = false;

/* --- tokenizer: the same shape the real lexer wants --- */
function tokenizeCmd(s) {
  return s.split(/(\s+)/).filter(Boolean).map((t) => {
    if (/^\s+$/.test(t))       return { t, cls:"" };
    if (t.startsWith("/"))     return { t, cls:"t-op" + (OPS[t] ? "" : " bad") };
    if (t.startsWith("c:")) {
      const n = t.slice(2);
      const a = A[n];
      return { t, cls:"t-ref" + (!a ? " unknown" : a.status === "pending" ? " pending" : "") };
    }
    if (t.startsWith("--"))    return { t, cls:"t-flag" };
    if (/^\d+x\d+$/.test(t))   return { t, cls:"t-size" };
    if (/^[\d.]+$/.test(t))    return { t, cls:"t-num" };
    return { t, cls:"t-txt" };
  });
}

function paintCmd() {
  const hl = el("cmdhl"); if (!hl) return;
  hl.innerHTML = tokenizeCmd(cmdText)
    .map(({ t, cls }) => cls ? `<span class="${cls}">${escHtml(t)}</span>` : escHtml(t))
    .join("");
  const input = el("cmd");
  if (input) hl.scrollLeft = input.scrollLeft;
}

const escHtml = (s) => s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");

/* --- what the cursor is sitting in --- */
function cmdCtx() {
  const input = el("cmd");
  const upto = cmdText.slice(0, input ? input.selectionStart : cmdText.length);
  const words = upto.split(/\s+/);
  const partial = /\s$/.test(upto) ? "" : words[words.length - 1];
  const done = /\s$/.test(upto) ? words.filter(Boolean) : words.filter(Boolean).slice(0, -1);
  const op = OPS[done[0]] ? done[0] : (OPS[partial] ? partial : null);
  return { words: done, partial, op, hasRef: done.some(w => w.startsWith("c:")) };
}

/* --- completion --- */
function completions() {
  const { words, partial, op, hasRef } = cmdCtx();

  if (!op || words.length === 0) {
    return { head:"operation",
      items: Object.entries(OPS)
        .filter(([k]) => k.startsWith(partial) || !partial)
        .map(([k, v]) => ({ label:k, hint:v.desc, kind:"op" })) };
  }
  const prev = words[words.length - 1];
  if (FLAG_VALUES[prev]) {
    return { head:prev.slice(2),
      items: FLAG_VALUES[prev].filter(v => v.startsWith(partial))
        .map(v => ({ label:v, hint:"", kind:"val" })) };
  }
  if (partial.startsWith("--") || (partial === "" && hasRef)) {
    const flags = (OPS[op].flags || []).filter(f => f.startsWith(partial));
    if (flags.length && (partial.startsWith("--") || !OPS[op].sig[1]))
      return { head:"flags", items: flags.map(f => ({ label:f, hint:"", kind:"flag" })) };
  }
  if (!hasRef) {
    const q = partial.replace(/^c:/, "");
    return { head:"artifact",
      items: NAMES.filter(n => n.includes(q)).map(n => ({
        label:"c:" + n, hint: A[n].status === "pending" ? "not created" : A[n].kind,
        kind:"ref", name:n })) };
  }
  return { head:"", items:[] };
}

function renderAc() {
  document.querySelector(".cmdac")?.remove();
  const inp = el("cmd");
  if (!inp || document.activeElement !== inp) { acOpen = false; return; }
  const { head, items } = completions();
  if (!items.length) { acOpen = false; return; }
  acOpen = true;
  acSel = Math.max(0, Math.min(acSel, items.length - 1));

  const box = document.createElement("div");
  box.className = "cmdac";
  box.innerHTML = `<div class="cmdac-head">${head}</div>` + items.map((it, i) => {
    const sw = it.kind === "ref"
      ? `<span class="ac-sw" style="background:${A[it.name].status === "pending"
          ? "var(--amber-bg)" : `hsl(${A[it.name].hue} 42% 32%)`};color:${
          A[it.name].status === "pending" ? "var(--amber)" : "rgba(255,255,255,.8)"}">${
          A[it.name].status === "pending" ? "+" : it.name[0].toUpperCase()}</span>`
      : `<span class="ac-sw" style="background:rgba(139,92,246,.18);color:var(--violet)">${
          it.kind === "flag" ? "-" : it.kind === "val" ? "=" : "/"}</span>`;
    return `<div class="ac-row${i === acSel ? " on" : ""}" data-ac="${i}">${sw}` +
           `<span class="ac-lbl${it.kind === "ref" && A[it.name].status === "pending" ? " pending" : ""}">` +
           `${it.label}</span>` +
           (it.hint ? `<span class="ac-hint">${it.hint}</span>` : "") + `</div>`;
  }).join("");

  const bar = document.querySelector(".cmdbar");
  box.style.left = (bar.querySelector(".cmdwrap").offsetLeft) + "px";
  document.querySelector(".composer").appendChild(box);
}

function acceptCompletion() {
  const { items } = completions();
  const it = items[acSel]; if (!it) return;
  const input = el("cmd");
  const upto = cmdText.slice(0, input.selectionStart);
  const rest = cmdText.slice(input.selectionStart);
  const cut = /\s$/.test(upto) ? upto : upto.replace(/\S*$/, "");
  cmdText = cut + it.label + " " + rest.replace(/^\s+/, "");
  input.value = cmdText;
  const pos = (cut + it.label + " ").length;
  input.setSelectionRange(pos, pos);
  acSel = 0;
  paintCmd(); renderSig(); renderAc();
}

/* --- signature help --- */
function renderSig() {
  const sig = el("sig"); if (!sig) return;
  const { words, partial, op } = cmdCtx();
  if (!op) {
    sig.innerHTML = `<span class="p">type an operation — every inspector control has one</span>`;
    return;
  }
  const spec = OPS[op];
  const idx = Math.max(0, words.length - 1 + (partial ? 0 : 0));
  sig.innerHTML = `<span class="sig-op">${op}</span>` +
    spec.sig.map((p, i) => `<span class="p${i === idx ? " on" : ""}">${escHtml(p)}</span>`).join("") +
    (spec.flags.length ? `<span class="p">${spec.flags.map(f => `[${f}]`).join(" ")}</span>` : "") +
    `<span class="sig-desc">${spec.desc}</span>`;
}

/* --- execution: commands move the inspector --- */
function runCmd() {
  const parts = cmdText.trim().split(/\s+/).filter(Boolean);
  if (!parts.length) return;
  const op = parts[0];
  const ref = (parts.find(w => w.startsWith("c:")) || "").slice(2) || open;
  const p = params(ref);
  const flag = (f) => { const i = parts.indexOf(f); return i >= 0 ? parts[i + 1] : null; };
  const rest = parts.slice(1).filter(w => !w.startsWith("c:") && !w.startsWith("--"))
                    .filter((w, i, arr) => !FLAG_VALUES[parts[parts.indexOf(w) - 1]] || false);

  if (op === "/resize" && rest[0]) p.size = rest[0];
  if (op === "/describe" && rest.length) p.desc = rest.join(" ").replace(/^["']|["']$/g, "");
  if (flag("--steps")) p.steps = +flag("--steps");
  if (flag("--size"))  p.size = flag("--size");
  if (flag("--seed") === "locked") p.seedLocked = true;
  if (flag("--seed") === "random") p.seedLocked = false;
  if (op === "/lora" && parts[1] === "attach") {
    p.lora = rest.find(w => w !== "attach") || p.lora || "coastal_grit";
    if (flag("--weight")) p.loraWeight = +flag("--weight");
  }
  if (op === "/modify" && rest.length) {
    (REVS[ref] = REVS[ref] || []).unshift({
      t: rest.join(" "), sub:`rev ${(REVS[ref]?.length || 0) + 1} · modify · seed ${p.seed}`,
      tag:"exp", v:variant });
    rev = 0;
  }
  cmdText = ""; acSel = 0;
  if (ref !== open && A[ref]) { openArtifact(ref); }
  else renderDetail();
  el("cmd")?.focus();
}

function wireCmd() {
  const input = el("cmd"); if (!input) return;
  input.value = cmdText;
  paintCmd(); renderSig();

  input.addEventListener("input", () => {
    cmdText = input.value; acSel = 0; paintCmd(); renderSig(); renderAc();
  });
  input.addEventListener("scroll", paintCmd);
  input.addEventListener("focus", () => { cmdFocused = true; setMode("insert"); renderAc(); });
  input.addEventListener("blur", () => {
    cmdFocused = false; setMode("normal");
    setTimeout(() => document.querySelector(".cmdac")?.remove(), 120);
  });
  input.addEventListener("keydown", (e) => {
    if (e.key === "Tab")       { e.preventDefault(); acceptCompletion(); return; }
    if (e.key === "ArrowDown") { e.preventDefault(); acSel++; renderAc(); return; }
    if (e.key === "ArrowUp")   { e.preventDefault(); acSel--; renderAc(); return; }
    /* Enter always runs; Tab is the only way to accept a completion. An
       exact-match popup must never swallow the run. */
    if (e.key === "Enter")     { e.preventDefault(); runCmd(); return; }
    if (e.key === "Escape")    { e.preventDefault();
                                 if (acOpen) { document.querySelector(".cmdac")?.remove(); acOpen = false; }
                                 else input.blur();
                                 return; }
    setTimeout(() => { paintCmd(); renderSig(); renderAc(); }, 0);
  });

  if (cmdFocused) input.focus();
}

function openArtifact(name) {
  open = name; sel = Math.max(0, NAMES.indexOf(name));
  view = "detail"; variant = 1; rev = 0; render();
}

/* ---------------------------------------------------------------- palette
   Context-aware: the commands offered depend on where you are. Same closed
   vocabulary as the composer and the CLI. */

let palOn = false, palSel = 0, palQ = "";

function commands() {
  if (view === "detail") {
    const a = A[open];
    return [
      ["/variant c:" + open,            "new look from this base"],
      ["/regenerate c:" + open,         "reroll with the same description"],
      ["/modify c:" + open + " …",      "instruction edit — an experiment"],
      ["/describe c:" + open + " …",    "make an edit canonical"],
      ["/resize c:" + open + " …",      "set the artifact canvas"],
      ["/lora attach c:" + open,        "bind a LoRA"],
      ["go story " + (P[open]?.appearsIn[0] || ""), "jump to where it is used"],
      ["go canvas",                     "back to all artifacts"],
    ];
  }
  return [
    ["/create character …",    "new artifact"],
    ["/create environment …",  "new artifact"],
    ["/create object …",       "new artifact"],
    ...NAMES.map(n => ["open " + n, A[n].status === "pending" ? "not created yet" : A[n].kind]),
    ["go story",               "back to the writer"],
    ["run story",              "play the sequence"],
  ];
}

function palMatches() {
  const q = palQ.toLowerCase().trim();
  const all = commands();
  return q ? all.filter(([c, d]) => (c + " " + d).toLowerCase().includes(q)) : all;
}

function renderPal() {
  const m = palMatches();
  palSel = Math.max(0, Math.min(palSel, m.length - 1));
  el("palScope").textContent = view === "detail" ? open : "canvas";
  el("palList").innerHTML = m.length
    ? m.map(([c, d], i) =>
        `<div class="pal-item${i === palSel ? " on" : ""}" data-i="${i}">` +
        `<span class="pal-cmd">${c}</span><span class="pal-desc">${d}</span></div>`).join("")
    : `<div class="pal-empty">No command matches “${palQ}”.</div>`;
}

function palOpen() {
  palOn = true; palQ = ""; palSel = 0;
  el("veil").hidden = false;
  el("palQ").value = "";
  renderPal();
  el("palQ").focus();
}
function palClose() { palOn = false; el("veil").hidden = true; }

function palRun() {
  const hit = palMatches()[palSel];
  if (!hit) return;
  const cmd = hit[0];
  palClose();
  if (cmd.startsWith("open ")) openArtifact(cmd.slice(5));
  else if (cmd === "go canvas") { view = "home"; render(); }
}

/* ------------------------------------------------------------------- keys */

document.addEventListener("keydown", (e) => {
  if (palOn) {
    if (e.key === "Escape") { palClose(); e.preventDefault(); }
    if (e.key === "ArrowDown") { palSel++; renderPal(); e.preventDefault(); }
    if (e.key === "ArrowUp")   { palSel--; renderPal(); e.preventDefault(); }
    if (e.key === "Enter")     { palRun(); e.preventDefault(); }
    return;
  }
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); palOpen(); return; }

  /* typing in a field must not be swallowed by the nav keys */
  const tag = document.activeElement?.tagName;
  if (tag === "TEXTAREA" || tag === "INPUT") {
    if (e.key === "Escape" && tag === "TEXTAREA") {
      document.activeElement.blur(); setMode("normal");
    }
    return;
  }

  if (e.key === "Escape") {
    if (view === "detail") { view = "home"; setMode("normal"); render(); }
    else setMode("normal");
    return;
  }

  if (view === "home") {
    const k = e.key;
    if (k === "l" || k === "ArrowRight") { sel = Math.min(NAMES.length - 1, sel + 1); render(); }
    if (k === "h" || k === "ArrowLeft")  { sel = Math.max(0, sel - 1); render(); }
    if (k === "j" || k === "ArrowDown")  { sel = Math.min(NAMES.length - 1, sel + cols); render(); }
    if (k === "k" || k === "ArrowUp")    { sel = Math.max(0, sel - cols); render(); }
    if (k === "Enter") openArtifact(NAMES[sel]);
    if (["h","j","k","l","Enter"].includes(k)) e.preventDefault();
  } else {
    const a = A[open], list = REVS[open] || [];
    if (e.key === "]") { variant = Math.min(Math.max(a.variants, 1), variant + 1); render(); }
    if (e.key === "[") { variant = Math.max(1, variant - 1); render(); }
    if (e.key === "j" || e.key === "ArrowDown") { rev = Math.min(list.length - 1, rev + 1); render(); e.preventDefault(); }
    if (e.key === "k" || e.key === "ArrowUp")   { rev = Math.max(0, rev - 1); render(); e.preventDefault(); }
    if (e.key === "i") { document.getElementById("descBox")?.focus(); setMode("insert"); e.preventDefault(); }
    if (e.key === "c" || e.key === "/") { el("cmd")?.focus(); e.preventDefault(); }
  }
});

/* ------------------------------------------------------------------ mouse */

document.addEventListener("mousedown", (e) => {
  const row = e.target.closest(".ac-row");
  if (row) { e.preventDefault(); acSel = +row.dataset.ac; acceptCompletion(); el("cmd")?.focus(); }
});

document.addEventListener("click", (e) => {
  const pal = e.target.closest(".pal-item");
  if (pal) { palSel = +pal.dataset.i; palRun(); return; }

  const t = e.target.closest(".tile");
  if (t) { openArtifact(NAMES[+t.dataset.i]); return; }

  const v = e.target.closest(".chip-v[data-v]");
  if (v) { variant = +v.dataset.v; render(); return; }

  const sz = e.target.closest("[data-size]");
  if (sz) { params(open).size = sz.dataset.size; renderDetail(); return; }

  if (e.target.closest("#lockBtn")) {
    const p = params(open); p.seedLocked = !p.seedLocked; renderDetail(); return;
  }

  const rv = e.target.closest(".rev");
  if (rv) { rev = +rv.dataset.rev; render(); return; }
});

el("veil").addEventListener("click", (e) => { if (e.target === el("veil")) palClose(); });
el("palQ").addEventListener("input", (e) => { palQ = e.target.value; palSel = 0; renderPal(); });

/* keep the grid cursor arithmetic honest */
const measure = () => {
  const g = document.querySelector(".grid");
  if (g) cols = getComputedStyle(g).gridTemplateColumns.split(" ").length;
};
window.addEventListener("resize", () => { measure(); });

render(); measure();
</script>
</body>
</html>
