[package]
name = "storyfella-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Write, arrange, and preview visual stories."

[dependencies]
agentkit-ai.workspace = true
storyfella-language.workspace = true
storyfella-compiler.workspace = true
storyfella-runtime.workspace = true
storyfella-studio-core = { path = "../../crates/studio-core" }
storyfella-playback-panel.workspace = true
design-system.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

# A preview capture renders the stage in a headless GPUI app on the Metal
# renderer. That API sits behind `test-support`, so the shipping build turns it
# on; `capture`'s pixel test fails if a gpui-pre bump breaks it.
[target.'cfg(target_os = "macos")'.dependencies]
gpui = { workspace = true, features = ["test-support"] }
gpui-apple = { workspace = true, features = ["test-support"] }
base64.workspace = true
image.workspace = true

[dev-dependencies]
gpui = { workspace = true, features = ["test-support"] }
tempfile.workspace = true
