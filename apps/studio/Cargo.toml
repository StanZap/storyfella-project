[package]
# The product's name stays the package name: the `dx` build/bundle artifact
# names and the documented launch paths key off it.
name = "storyfella-studio"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Write, arrange, and preview visual stories."

[features]
default = ["desktop"]
desktop = ["dioxus/desktop"]

[dependencies]
agentkit-ai.workspace = true
storyfella-language.workspace = true
storyfella-compiler.workspace = true
storyfella-playback-ui.workspace = true
storyfella-runtime.workspace = true
storyfella-studio-core = { path = "../../crates/studio-core" }
anyhow.workspace = true
dioxus.workspace = true
rfd.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml.workspace = true
sha2.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true

[dev-dependencies]
tempfile.workspace = true
