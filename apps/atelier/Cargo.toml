[package]
name = "storyfella-atelier"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Draw, edit, and generate artwork."
publish = false

[[bin]]
name = "atelier"
path = "src/main.rs"

[package.metadata.packager]
product-name = "Atelier"
identifier = "com.storyfella.atelier"
category = "Graphics"
icons = ["packaging/atelier.png"]
binaries = [{ path = "atelier", main = true }]

[package.metadata.packager.deb]
package-name = "storyfella-atelier"
section = "graphics"
depends = [
    "libc6", "libgcc-s1", "libfontconfig1", "libfreetype6", "libvulkan1",
    "libegl1", "libwayland-client0", "libxcb1", "libxkbcommon0", "libxkbcommon-x11-0",
]

[dependencies]
agentkit-ai.workspace = true
agentkit-mcp.workspace = true
clap.workspace = true
same-file.workspace = true
storyfella-studio-core.workspace = true
gpui-kit.workspace = true
anyhow.workspace = true
tokio.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
uuid.workspace = true
image.workspace = true
tiny-skia.workspace = true
base64.workspace = true
sha2.workspace = true
reqwest = { workspace = true, features = ["blocking", "query"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true
metal.workspace = true
core-video = { workspace = true, features = ["metal"] }
core-foundation.workspace = true

[dev-dependencies]
storyfella-runtime.workspace = true
tempfile.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { workspace = true, features = ["test-support"] }
