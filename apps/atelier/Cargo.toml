[package]
name = "storyfella-atelier"
version.workspace = true
edition.workspace = true
publish = false

[[bin]]
name = "atelier"
path = "src/main.rs"

[dependencies]
gpui-kit.workspace = true
anyhow.workspace = true
clipforge-inference.workspace = true
tokio.workspace = true
serde = { workspace = true, features = ["rc"] }
serde_json.workspace = true
image.workspace = true
tiny-skia.workspace = true
base64.workspace = true
reqwest = { workspace = true, features = ["blocking", "query"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework.workspace = true

objc2.workspace = true
objc2-app-kit.workspace = true
block2.workspace = true
metal.workspace = true
core-video = { workspace = true, features = ["metal"] }
core-foundation.workspace = true

[target.'cfg(target_os = "macos")'.dev-dependencies]
gpui-pre-apple = { workspace = true, features = ["test-support"] }
