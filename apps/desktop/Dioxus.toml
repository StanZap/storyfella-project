[application]
# Display name; the window title is set in `src/main.rs` and must stay in sync.
name = "Smart Visual Sequencer"

# Bundle identity for `dx bundle` (AppImage/.deb on Linux, .app on macOS).
# Every key here is described by `dx config schema`. See `docs/development.md`
# → Bundling for which of them actually reach the Linux artifacts.
[bundle]
# Matches the qualifier/organization the app already passes to
# `ProjectDirs::from("dev", "Smart Visual Sequencer", …)` in `src/app/config.rs`.
identifier = "dev.smartvisualsequencer"
publisher = "Smart Visual Sequencer"
category = "Graphics"
short_description = "Plan, generate, and arrange visual stories."
long_description = "A desktop workspace for planning, generating, and arranging visual stories: a registry of characters, environments, objects and scenes, edited through typed operations and generated locally."

# Note: `[linux] categories`/`keywords` do nothing in dx 0.7.10 — the generated
# .desktop keeps `Categories=` empty and omits `Keywords=` whatever they hold
# (verified on both the appimage and deb package types). See
# `docs/development.md` → Bundling.
