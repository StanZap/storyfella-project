[package]
name = "svs-cli"
version.workspace = true
edition.workspace = true
authors.workspace = true
description = "Command-line tools for Storyfella Studio."

[[bin]]
name = "svs"
path = "src/bin/svs.rs"

[[bin]]
name = "model_setup"
path = "src/bin/model_setup.rs"

[[bin]]
name = "vlm_probe"
path = "src/bin/vlm_probe.rs"

[dependencies]
storyfella-compiler.workspace = true
storyfella-language.workspace = true
storyfella-runtime.workspace = true
storyfella-studio-core = { path = "../../crates/studio-core" }
anyhow.workspace = true
base64.workspace = true
clap.workspace = true
clipforge-inference.workspace = true
image.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
uuid.workspace = true
