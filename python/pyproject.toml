[project]
name = "smart-visual-sequencer-runtime"
version = "0.1.0"
description = "Vision runtime for Smart Visual Sequencer"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.116,<1",
    "numpy>=2,<3",
    "pillow>=11,<13",
    "pydantic>=2,<3",
    "uvicorn>=0.35,<1",
]

[project.optional-dependencies]
image-generation = [
    "accelerate>=1.14.0",
    "diffusers>=0.39.0",
    "safetensors>=0.8.0",
    "sentencepiece>=0.2.2",
    "torch>=2.13.0",
    "transformers>=5.14.1",
]

[tool.uv]
package = false

# Keep ML frameworks optional so API and contract work does not require a large
# model environment. SAM and other vision backends will get their own extras.
