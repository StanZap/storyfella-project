# Workspace root.
#
#   crates/studio-core   — the domain layer (artifact registry, typed operations,
#                   persistence, the native generation client, and the
#                   runtime/LLM clients). No GUI dependency, so `sf-cli` and the
#                   core tests never compile the toolkit.
#   apps/studio  — the GPUI application: UI, state, command language and the
#                   plan driver.
#   apps/cli      — `sf-cli` story commands and MCP.
#   apps/player   — the GPUI desktop Player.
#   crates/playback-panel — the GPUI playback panel and stage.
#   xtask         — `cargo xtask`: the developer task runner (build/run/
#                   check/test). Not part of any shipped artifact.
#
# The `.cargo/config.toml` target-dir redirect must stay at this level.
[workspace]
members = ["crates/studio-core", "crates/language", "crates/compiler", "crates/lsp", "crates/runtime", "crates/playback-panel", "apps/studio", "apps/cli", "apps/player", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stanley <Zapata>"]

# One place for versions, so a bump cannot land in three manifests with two
# different values.
[workspace.dependencies]
storyfella-studio-core = { path = "crates/studio-core" }
storyfella-language = { path = "crates/language" }
storyfella-compiler = { path = "crates/compiler" }
storyfella-runtime = { path = "crates/runtime" }
storyfella-playback-panel = { path = "crates/playback-panel" }
# GPUI apps share the design system with Atelier in ../storyfella-canvas, and
# pin the same exact gpui-kit and gpui-pre releases it does.
design-system = { path = "../gpui-design-system/crates/components" }
gpui-kit = "=0.10.0"
gpui = { package = "gpui-pre", version = "=0.3.12" }
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
# The shared native-inference runtime (stable-diffusion.cpp `sd-server`): the
# model store, the served profile, the resident process, and the `sdcpp` HTTP
# client. Owned by the shared Agentkit workspace.
agentkit-core = { path = "../../zerune_labs/agentkit/crates/agentkit-core" }
agentkit-mcp = { path = "../../zerune_labs/agentkit/crates/agentkit-mcp" }
agentkit-workflow = { path = "../../zerune_labs/agentkit/crates/agentkit-workflow" }
agentkit-ai = { path = "../../zerune_labs/agentkit/crates/agentkit-ai", features = ["native-inference"] }
directories = "6.0.0"
# Three-way source merging preserves manual review edits across AI retries.
diffy = "0.5.2"
tempfile = "3.10"
futures-util = "0.3.33"
image = "0.25.10"
parking_lot = "0.12.5"
rusqlite = { version = "0.40.1", features = ["bundled", "backup"] }
same-file = "1.0.6"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
url = "2"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "fs", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
