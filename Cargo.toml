# Workspace root.
#
#   crates/studio-core   — the domain layer (artifact registry, typed operations,
#                   persistence, the native generation client, and the
#                   runtime/LLM clients). No GUI dependency, so `svs` and the
#                   core tests never compile the toolkit or the WebKit stack.
#   apps/studio  — the Dioxus application: UI, state, command language, the
#                   plan driver, and the compiled assets. Owns the `desktop`
#                   feature.
#   apps/cli      — `svs`, `model_setup`, `vlm_probe`.
#   apps/player   — standalone Player placeholder; GUI framework undecided.
#   xtask         — `cargo xtask`: the developer task runner (build/run/bundle/
#                   check/test). Not part of any shipped artifact.
#
# The `.cargo/config.toml` target-dir redirect must stay at this level.
[workspace]
members = ["crates/studio-core", "crates/language", "crates/compiler", "crates/lsp", "apps/studio", "apps/cli", "apps/player", "xtask"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["Stanley <Zapata>"]

# One place for versions, so a bump cannot land in three manifests with two
# different values.
[workspace.dependencies]
storyfella-language = { path = "crates/language" }
storyfella-compiler = { path = "crates/compiler" }
anyhow = "1.0.104"
base64 = "0.23.0"
clap = { version = "4.6.5", features = ["derive"] }
# The shared native-inference runtime (stable-diffusion.cpp `sd-server`): the
# model store, the served profile, the resident process, and the `sdcpp` HTTP
# client. Owned by the sibling `clipforge` workspace.
clipforge-inference = { path = "../clipforge/crates/inference" }
directories = "6.0.0"
dioxus = { version = "0.7.10", features = [] }
futures-util = "0.3.33"
image = "0.25.10"
parking_lot = "0.12.5"
reqwest = { version = "0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
rfd = { version = "0.17.2", default-features = false, features = ["xdg-portal"] }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2.0.19"
tokio = { version = "1.53.1", features = ["rt-multi-thread", "macros", "process", "time", "signal", "fs", "io-util"] }
toml = "1.1.4"
tracing = "0.1.44"
tracing-subscriber = "0.3.23"
uuid = { version = "1.24.0", features = ["v4", "serde"] }
