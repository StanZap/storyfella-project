[generation.sizes]
# VAE tiling (enabled client-side) keeps the decode buffers small, so the
# full portrait canvas fits the 24GiB card even with the resident encoder.
character = "1024x1536"
[lora]
inpaint = "krea/INPAINTKREA-V1.safetensors"
# Krea's identity-preserving edit adapter: applied to variant/regenerate
# only (not create/modify — its 1.8GB resident footprint would push the
# 24GiB card over budget on mask edits).
variant = "krea/krea2_identity_edit_v1_2.safetensors"
multiplier = 1.0
[lm_studio]
base_url = "http://localhost:1234/v1"
# Instruction grounding for `modify` is a subtraction task — restate the
# artifact's traits as invariants, minus the one the edit changes — and it
# is model-sensitive. Measured 2026-08-10 on the same prompt: gemma-4-e4b
# kept "long dark hair" while the edit asked for auburn (the editor rendered
# both, splitting the hair down the middle) and in one phrasing invented a
# colour outright; bonsai-27b updated the trait to "long auburn hair" and
# got the haircut and outfit cases right too. Prefer a larger planner here.
model = "prism-ml/bonsai-27b"
# api_key = "lm-studio"
timeout_seconds = 60

[generation]
steps = 8
base_url = "http://127.0.0.1:7861"
profile = "krea-2-turbo-q4"
# executable and lora_dir default beneath model_dir.
# executable = "models/runtime/stable-diffusion.cpp/bin/sd-server"
# lora_dir = "models/loras"
# steps = 4                                  # default steps per generation
# [generation.sizes]                         # per-kind default canvases (WxH)
# character = "512x768"
# environment = "1024x576"
# object = "768x768"
# scene = "1024x576"
# beat = "1024x576"

# [lora]                                     # adapters by use-case (file names in lora_dir)
# inpaint = "inpaintkrea.safetensors"        # applied to /modify (mask-guided edits)
# character = "mia-v2.safetensors"
# environment = "sea-shore.safetensors"
# object = "brass-lantern.safetensors"
# multiplier = 1.0                           # weight for the bindings above

[paths]
python_runtime = "apps/vision"
# Development uses the model artifacts already provisioned in this checkout.
# Packaged builds may omit these overrides to use platform application directories.
model_dir = "models"
cache_dir = "cache"
asset_dir = "assets"
