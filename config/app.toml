[generation.sizes]
# Qwen-Image-2.1 has no few-step turbo path: it is sampled with CFG at ~25
# steps, and portrait characters use the full portrait canvas.
character = "1024x1536"

[lora]
multiplier = 1.0
# Per-kind adapters (file names in generation.lora_dir):
# character = "mia-v2.safetensors"
# environment = "sea-shore.safetensors"
# object = "brass-lantern.safetensors"

[lm_studio]
base_url = "http://localhost:1234/v1"
# Instruction grounding for `modify` is a subtraction task — restate the
# artifact's traits as invariants, minus the one the edit changes — and it
# is model-sensitive. Measured 2026-08-10 on the same prompt: gemma-4-e4b
# kept "long dark hair" while the edit asked for auburn (the editor rendered
# both, splitting the hair down the middle) and in one phrasing invented a
# colour outright; bonsai-27b updated the trait to "long auburn hair" and
# got the haircut and outfit cases right too. Prefer a larger planner here.
model = "prism-ml/bonsai-27b"
# api_key = "lm-studio"
timeout_seconds = 60

[generation]
steps = 25
cfg_scale = 6.0
sample_method = "euler"
base_url = "http://127.0.0.1:7861"
profile = "qwen-image-2.1"
# executable and lora_dir default beneath model_dir.
# executable = "models/runtime/stable-diffusion.cpp/bin/sd-server"
# lora_dir = "models/loras"

[paths]
# Development uses the model artifacts already provisioned in this checkout.
# Packaged builds may omit these overrides to use platform application directories.
model_dir = "models"
cache_dir = "cache"
asset_dir = "assets"
