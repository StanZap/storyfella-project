# The machine's shared AI configuration. Copy it to the platform config
# directory (Linux ~/.config/clipforge/clipforge.toml) and replace /home/you
# with your installed paths.
#
# Every front end on the machine — Storyfella Studio, Atelier, the Clipforge
# apps — resolves its providers from this one file, and native image models
# share the single address below: sd-server fixes its weights at startup, so
# switching a model restarts the one server rather than starting a second.
[defaults]
t2i = "qwen"
edit = "qwen"

[providers.qwen]
kind = "sdcpp"
architecture = "qwen-image-2.1"
capabilities = ["t2i", "edit"]
base_url = "http://127.0.0.1:7861"
model_dir = "/home/you/.local/share/clipforge/models"
executable = "/home/you/.local/share/clipforge/models/runtime/stable-diffusion.cpp/bin/sd-server"
residency = "lowvram"

[providers.krea]
kind = "sdcpp"
architecture = "krea2-turbo"
capabilities = ["t2i"]
base_url = "http://127.0.0.1:7861"
model_dir = "/home/you/.local/share/clipforge/models"
executable = "/home/you/.local/share/clipforge/models/runtime/stable-diffusion.cpp/bin/sd-server"
residency = "lowvram"
