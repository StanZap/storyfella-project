name: "Story authoring walkthrough"
description: "Source, references, saved artwork and asset definitions. No image generation."
speed_ms: 900
typing_cps: 80
steps:
  - sample_project: true
    message: "Story writing and asset references stay in Studio. Visual production opens in Atelier."
  - go_story: true
  - caret: 4
    message: "Resolved references lead to their asset previews and Open in Atelier."
  - go_assets: true
  - open: mara
    message: "Inspect saved artwork and authoring metadata. Image editing and generation belong to Atelier."
  - command: "/describe c:mara A harbourmaster in her fifties, silver crop, storm-grey oilskin"
  - palette: true
    message: "The palette offers navigation, definitions and project actions."
  - palette: false
  - go_story: true
  - type_story: |2
        beat signal
          narrate: The lamp answers the sea.
  - expect_artifact: { name: mara, kind: character }
  - expect_no_error: true
