# The mask-editing plan's mechanics, without a backend.
#
# `mask-editing.yaml` is the demonstration; this is the regression. It runs
# the same brush steps against the sample project's existing pictures, so
# the tool rail, the painting, and `--mask painted` resolving to a real mask
# file are all checked without a GPU. The generation itself is the other
# plan's business.
name: "Masked editing (mechanics)"
description: "Check the tool rail, painting, and mask resolution without generating anything."
speed_ms: 400
steps:
  - sample_project: true
    message: "The sample project, so there are pictures to paint on without a backend."
  - go_canvas: true
  - open: "mara"
    wait_ms: 200
    message: "An artifact with an image — the rail only appears over a picture."

  - select_tool: "brush"
  - paint:
      - { x: 0.5, y: 0.2, r: 0.12 }
      - { x: 0.4, y: 0.26, r: 0.1 }
    message: "Two dabs, in fractions of the image."
  - expect_painted_mask: true
    message: "The strokes are rasterised to a mask file, which is what `--mask painted` resolves to."

  - clear_mask: true
  - expect_painted_mask: false
    message: "Cleared. A painted mask belongs to the moment, not to the artifact."

  - select_tool: "pointer"
    message: "And back to the pointer, with nothing painted."
