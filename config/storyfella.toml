[generation.sizes]
# Qwen-Image-2.1 has no few-step turbo path: it is sampled with CFG at ~25
# steps, and portrait characters use the full portrait canvas.
character = "1024x1536"

[lora]
multiplier = 1.0
# Per-kind adapters (file names in the image engine's lora_dir):
# character = "mia-v2.safetensors"
# environment = "sea-shore.safetensors"
# object = "brass-lantern.safetensors"

[generation]
steps = 25
cfg_scale = 6.0
sample_method = "euler"

[paths]
# Development uses the assets and cache already set up in this checkout.
# Packaged builds may omit these overrides to use platform application directories.
# Model storage defaults to OS-local application data in every build.
# Set [providers.qwen-image] model_dir to override it explicitly.
cache_dir = "cache"
asset_dir = "assets"

# Inference is one part of the general application configuration.
[defaults]
t2i = "qwen-image"
edit = "qwen-image"
text = "local"
vision = "vision"

[providers.qwen-image]
kind = "sdcpp"
architecture = "qwen-image-2.1"
capabilities = ["t2i", "edit"]
base_url = "http://127.0.0.1:7861"
# model_dir, lora_dir and executable may name installed local locations.
# Omitted model_dir uses the OS-native Storyfella models folder.
# residency = "lowvram"

[providers.local]
kind = "openai"
capabilities = ["text"]
base_url = "http://localhost:8080/v1"
model = "prism-ml/bonsai-27b"

[providers.vision]
kind = "openai"
capabilities = ["vision"]
base_url = "http://localhost:8080/v1"
model = "google/gemma-4-e4b"
