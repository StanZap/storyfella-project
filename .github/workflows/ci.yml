name: Storyfella

on:
  push:
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          path: storyfella
      # Inference remains a separate sibling repository.
      - uses: actions/checkout@v4
        with:
          repository: StanZap/clipforge
          path: clipforge
          # A private sibling needs a token with read access to that repository.
          token: ${{ secrets.CLIPFORGE_READ_TOKEN || github.token }}
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux desktop dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libasound2-dev libudev-dev libglib2.0-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev xvfb
      - name: Format
        working-directory: storyfella
        run: cargo fmt --all -- --check
      - name: Check
        working-directory: storyfella
        run: cargo check --workspace --all-targets --locked
      - name: Clippy
        working-directory: storyfella
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Test
        working-directory: storyfella
        run: cargo test --workspace --locked
      - name: CLI and Player
        working-directory: storyfella
        run: |
          cargo build -p sf-cli -p storyfella-player --locked
          cargo run -p sf-cli --locked -- --help
          cargo run -p storyfella-player --locked -- --help
      - name: Studio build and smoke plan
        working-directory: storyfella
        run: |
          cargo xtask build
          timeout 120s xvfb-run -a cargo xtask plan config/plans/smoke.yaml --mode check --log
