[build]
# Keep compiled artifacts outside the checkout, including when its parent has
# `:`, which macOS/Linux library-path variables treat as a separator.
target-dir = "/tmp/storyfella-studio-target"

[alias]
# `cargo xtask <command>` — the developer task runner. See xtask/src/main.rs.
xtask = "run --package xtask --"
