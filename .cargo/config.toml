[build]
# Build output belongs to this checkout, including dx desktop bundles.
target-dir = "target"

[env]
# Cargo, tests, subprocesses and cargo-launched apps use checkout-local temporary
# files. This tracked directory exists before Cargo starts; its contents are ignored.
TMPDIR = { value = ".cargo/tmp", relative = true, force = true }
TMP = { value = ".cargo/tmp", relative = true, force = true }
TEMP = { value = ".cargo/tmp", relative = true, force = true }

[alias]
# `cargo xtask <command>` — the developer task runner. See xtask/src/main.rs.
xtask = "run --package xtask --"
